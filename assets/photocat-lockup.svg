<?xml version="1.0" encoding="UTF-8"?>
<!--
  photocat — the lockup: the mark and the word side by side.

  The colours are CSS variables, so one file serves both themes:
    "photocat-mark"  the ink of the mark
    "photocat-word"  the word
    "photocat-band"  the ground strip; "transparent" drops it and leaves the mark and the word
                     alone on the page's own background.
  A browser follows the system theme; `assets/render.sh` substitutes the variables before it
  rasterises, because the renderers of this repository do not read `var()`.

  The shapes and the crop are the owner's drawing, kept verbatim (the 512 by 512 square of the
  original was mostly air: the ink span is copied into the viewBox below).
-->
